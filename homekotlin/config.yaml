name: "HomeKotlin"
description: "Type-safe, reactive Home Assistant automations written in Kotlin with hot reload and live dashboard"
version: "1.0.3"
slug: "homekotlin"
init: false
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:language-kotlin"
panel_title: "HomeKotlin"
homeassistant_api: true
map:
  - config:rw
  - share:rw
options:
  automations_dir: "/config/homekotlin/automations"
  log_level: "INFO"
schema:
  automations_dir: "str"
  log_level: "list(DEBUG|INFO|WARN|ERROR)"
